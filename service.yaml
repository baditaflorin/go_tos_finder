# real bugs: (1) Denmark's CVR-nr (Det Centrale Virksomhedsregister) had
# no identifier pattern at all - same class of gap as round 5's Polish
# NIP/KRS/REGON; added a dedicated "CVR" vatPattern, wired into the
# Register field and validated via the existing "DK" weighted-mod-11
# checksum (a DK-prefixed VAT number IS "DK" + the CVR body, no extra
# check digit) - confirmed against both kims.dk's real CVR (15233877) and
# webshop.dn.dk's independently found real CVR (60804214). (2) the real
# street line ("Somarksvej 31") had no address-vocabulary marker - "vej"
# (Danish for "road"/"way") glued onto a 2-digit house number clears no
# digit-run threshold at all; added "vej" as a marker, same shape as round
# 1's French "rue" and round 5's Polish "aleja". (3) fixing bug 1 exposed
# a third, pre-existing bug: the bare "ave" marker (meant for the US
# "Ave." abbreviation) substring-matched INSIDE the ordinary Danish verb
# "have", wrongly absorbing an unrelated age-disclaimer sentence into the
# address; re-anchored "ave" to its own word-boundary regexp, and added
# "cvr" to the address scan's identifier skip-list (same precedent as the
# existing Dutch KvK/BTW-id skip). Four new regression tests
# (imprint_extract_eu_round12_test.go); full existing suite still green,
# no regressions. No dedicated Danish ruleset added: section 7's CVR-nr
# requirement is conditional ("hvor det er relevant"/where applicable),
# same conditionality as round 11's Swedish precedent.
# 2026-08-22 (1.7.8) - EU-market-expansion real-evidence round 13: Finland.
# TRL stays at 6 (bug fix plus one new identifier, single-sample
# evidence). Fetched a real, live webshop's toimitus-ja-sopimusehdot page
# (finnprotec.fi, naming Finnprotec Oy) and ran the shipped 1.7.7
# extractor against it - it failed to extract legal_name or register at
# all (CompletenessScore 33, contact-only), despite "Finnprotec Oy" being
# trivially suffix-matchable ("Oy") right next to its Y-tunnus. Root
# cause: Finland's Y-tunnus (Business ID) had no domestic label-anchored
# identifier pattern at all - the existing VAT/FI pattern only matches
# the "FI"-prefixed, hyphen-free cross-border form, a different shape
# from the domestic hyphenated form ("1938183-5") this real page
# actually uses; same class of gap as round 12's Danish CVR-nr. Added a
# dedicated "Y-tunnus" vatPattern, wired into the Register field and
# validated via the existing "FI" weighted-mod-11 checksum (an
# FI-prefixed VAT number IS "FI" + the Y-tunnus body with its hyphen
# removed) - confirmed against this page's real Y-tunnus (1938183-5).
# Two new regression tests (imprint_extract_eu_round13_test.go); full
# existing suite still green, no regressions. No dedicated Finnish
# ruleset added: this real page has no physical street address on it at
# all - CompletenessScore reflects that honestly, same discipline as
# round 11's Swedish fixture.
# 2026-08-22 (1.7.9) - EU-market-expansion real-evidence round 14 (FINAL
# round of this series): Norway. TRL stays at 6 (bug fixes plus new
# checksum validation, single-sample evidence). Fetched a real, live
# photo-printing webshop's Kjopsvilkar page (japanphoto.no, naming CEWE
# Norge AS) and ran the shipped 1.7.8 extractor against it - it extracted
# NOTHING at all (CompletenessScore 0), despite "CEWE Norge AS" being
# trivially suffix-matchable ("AS") right next to its org.nr. Found and
# fixed four compounding real bugs: (1) the "OrgNr" vatPattern was
# case-sensitive (required literal capital "Org"), but ordinary
# mid-sentence Norwegian prose lower-cases it ("...med org.nr. 965 321
# 039..."); made it case-insensitive. (2) "OrgNr" had never been listed
# in extractImprintText's Kind switch at all - present in the table since
# this codebase's very first EU-expansion round, but silently dropped
# every time it matched; added it to the Register-field case. (3)
# Norway's organisasjonsnummer had no checksum-validation case at all
# despite the published Bronnoysundregistrene weighted-mod-11 algorithm
# being well documented; added norwayOrgNrValid, confirmed against the
# real org.nr (965321039). (4) the page's "Brev: CEWE Norge AS"
# postal-contact label (Norwegian for "Letter:") had no stripLabelPrefix
# entry, and its "Postboks 4 Bjorndal" PO-box line had no
# address-vocabulary marker; added both, same shape as round 12's Danish
# "vej". One real, NOT-fixed gap honestly documented: the page's own
# first-paragraph entity mention never produces a usable legal_name
# candidate (the 80-char backward-scan window can't reach a sentence
# boundary before that long opening clause) - the regression test uses
# the page's separate, clean Kontaktinformasjon section instead. Four new
# regression tests (imprint_extract_eu_round14_test.go); full existing
# suite still green, no regressions. No dedicated Norwegian ruleset
# added, consistent with every other Nordic country in this series. This
# closes the EU-market-expansion real-evidence series (rounds 1-14):
