id: go_tos_finder
name: Legal Document Finder
category: legal_analysis
version: "1.7.1"
trl: 6
trl_assessed_at: "2026-07-31"
trl_assessor: "claude-trl-reaudit-2026-07-31"
# 2026-08-22 (1.7.1) — EU-market-expansion real-evidence round 7: Belgium.
# TRL stays at 6 (bug fixes within the existing band, single-sample
# evidence). Fetched one real, live business's mentions légales page
# (factuo.be — a real multi-entity page, naming both the Belgian site
# owner and its French hosting provider) and ran the shipped 1.7.0
# extractor against it. Found and fixed two real bugs: (1) Belgian and
# French VAT numbers with the extremely common spaced formatting ("TVA BE
# 0704742612", "Num. de TVA : FR 29 421 527 797") went unmatched entirely
# — both patterns required the digits to butt directly against the
# country prefix with zero space; (2) a cross-entity address-absorption
# bug ("Nomenclature APE" — an alternate real phrasing of the French
# business-activity code distinct from "Code APE" fixed in round 1 — and
# "TVA" weren't stop-markers) dragged the unrelated French hosting
# company's entire address, in a different country, into the Belgian
# company's own address field. Proximity-based candidate disambiguation
# correctly preferred the site owner's own VAT over the hosting company's
# once both were matchable. One honestly-documented gap NOT fixed: the
# Belgian street line ("Rafhay 198") has no recognisable street-type word
# at all, a harder class of gap than the marker-based fixes so far — the
# "address" checklist item is still satisfied by the postal-code/city
# line found, so this doesn't affect completeness_score. No dedicated
# Belgian ruleset added: this fixture never surfaced a BCE/KBO
# register-number citation distinct from the VAT number, so there isn't
# yet real evidence register extraction works reliably for Belgium —
# staying on eu_baseline rather than overclaiming. Two new regression
# tests (imprint_extract_eu_round7_test.go); full existing suite still
# green, no regressions.
# 2026-08-22 (1.7.0) — EU-market-expansion real-evidence round 5: Poland.
# TRL stays at 6 (new capability, real-evidence-grounded, but a single
# sample page — not broad population validation). Fetched one real, live
# registry-data page (neptun.orlen.pl's real "Dane kontaktowe i
# rejestrowe") and ran the shipped 1.6.0 extractor against it: it
# extracted NOTHING at all — no legal_name, no address, no identifiers —
# despite "ORLEN Neptun sp. z o.o." being trivially suffix-matchable in
# isolation. Root cause: NIP/KRS/REGON (Poland's core registry
# identifiers) had no patterns modeled at all, so extractImprintText's
# isLegalPage fallback ("useful only if VAT/register IDs are present")
# bailed out before the suffix-anchored scan ever ran. Added NIP (domestic
# label-anchored form, same checksum algorithm as the existing PL-prefixed
# VAT pattern), KRS (National Court Register, wired as register — Poland's
# HRB/REA/SIREN equivalent), REGON (statistical ID), and a new pl_usude
# ruleset (Poland's e-Commerce Directive transposition) following the same
# base+register shape as round 4's four rulesets. Also fixed a real
# address false positive: the real street line ("Aleja Grunwaldzka 472,
# 80-309 Gdańsk") cleared no digit-run threshold and had no Polish
# street-word marker, so the newly-added NIP/KRS/REGON lines would
# otherwise have been wrongly absorbed into the address in its place —
# added "aleja" as a street marker and NIP/KRS/REGON as address-scan skip
# markers, same pattern as the Dutch KvK/BTW-id fix in round 1. One new
# regression test (imprint_extract_eu_round5_test.go); full existing suite
# still green, no regressions.
# 2026-08-22 (1.6.0) — dedicated national imprint rulesets: fr_lcen (LCEN
# Art. 6-III), it_dlgs70 (D.Lgs. 70/2003 Art. 7), es_lssice (LSSICE
# Art. 10), nl_handelsregisterwet — each requires base fields + register,
# deliberately NOT responsible_person (none of these four national laws
# require naming an individual, unlike DE/AT). TRL stays at 6: this is new
# capability (a checklist that now actually enforces what round-1/round-2
# already showed extraction could reliably find), and while it's grounded
# in real evidence, the sample is still small (1-2 real pages per country)
# — not the broad population validation TRL 7 would need. Adding a
# checklist item that actually gets checked surfaced three more real bugs
# the eu_baseline-only checklist had let slide uncaught: (1) the French
# SIRET pattern was case-sensitive and assumed a rigid 3-3-3-5 digit
# grouping — humresto.fr's real page writes "Siret" (mixed case) grouped
# 3-3-3-3-2; (2) Spain's Registro Mercantil "Hoja" citation had no pattern
# modeled at all; (3) Italy's country resolving to "RO" — documented as a
# known, deliberately-unfixed limitation in the 1.5.5 note below — is now
# fixed, not by touching suffixTable's ambiguous case-sensitive matching
# rules (which would have risked the SEPARATE real France-vs-Italy
# "S.A.S." collision in that same table) but by giving ground-truth
# single-country government-identifier evidence (a Partita IVA/REA number
# cannot possibly be Romanian) precedence over a merely-probabilistic
# suffix guess. Three new regression tests
# (imprint_extract_eu_round4_test.go) plus updated assertions in the
# round-1/round-2 tests reflecting the new, now-correct completeness
# scores; full existing suite still green, no regressions.
# 2026-08-22 (1.5.5) — EU-market-expansion real-evidence round 2: Italy and
# Spain. TRL stays at 6 (bug fixes within the existing band — Italy and
# Spain still fall back to eu_baseline, no dedicated ruleset yet). Fetched
# one real, live small/mid-size business imprint page per country
# (simanova.it's real note legali, eurostarshotels.com's real aviso legal)
# and ran the shipped 1.5.4 extractor against them. Found and fixed six
# real bugs: (1) Italy's REA business-register number had no pattern
# modeled at all; (2) Partita IVA and Spanish CIF were matched by
# findIdentifiers but silently dropped before reaching the winning
# candidate, since neither Kind appeared in extractImprintText's
# register/VAT attachment switch; (3) a genuine Kind-name collision made
# every Spanish CIF validate with Romania's roCUIValid algorithm instead of
# esCIFValid; (4) the emitted VAT value stored the raw label-anchored regex
# match (label text + embedded newlines) instead of the clean code; (5) the
# ALL-CAPS "S. R. L." (Italy, spaced) and undotted "SL" (Spain) suffix
# stylizations had no suffixTable entries at all; (6) a real
# 172-character unbroken legal-boilerplate sentence (name+register+CIF+
# phone, no <br> breaks — common Spanish/civil-law style) was silently
# skipped entirely by the 140-char per-line cap, raised to 220. Also fixed
# two smaller false positives found on the same two real pages: a "the
# owner of this website is: X" Spanish prose lead-in leaking into the
# extracted name, and a bare unlabelled international phone number (split
# from its "teléfono" label by a <a href="tel:..."> anchor) leaking into
# the address. One real, honestly-documented limitation deliberately left
# UNFIXED: simanova.it's JSON-LD name is ALL-CAPS "S.R.L.", which is a
# genuine literal-string collision with Romania's own native "S.R.L."
# suffixTable entry — Romanian companies write it exactly this way too, so
# this isn't a fixable-by-fiat Italy-vs-Romania bug; Country resolves to
# "RO" for this one page (VAT/register/completeness are all still correct).
# A real fix needs a broader case-sensitivity/confidence-model audit across
# the whole 200+-entry suffixTable that this round did not have budget to
# do safely. Two new permanent regression tests plus a direct CIF/CUI
# checksum unit test (imprint_extract_eu_round2_test.go); full existing
# suite (including round 1's France/Netherlands real-evidence tests) still
# green, no regressions.
# 2026-08-22 (1.5.4) — EU-market-expansion real-evidence round 1: France and
# the Netherlands. TRL stays at 6 (bug fixes within the existing band, not a
# new capability/ruleset — France and NL still fall back to eu_baseline, no
# dedicated fr_lcen/nl checklist yet). Fetched one real, live small-business
# imprint page per country (humresto.fr's real mentions-légales,
# simpelbootverhuurutrecht.nl's real colofon — honest sample size: 1 page
# per country, not broad population coverage) and ran the shipped 1.5.3
# extractor against them. Found and fixed seven real bugs: (1) casual French
# SARL/SAS prefix-form legal names ("SARL Hum!Resto") were never extracted
# at all — extractEntityAround only handled name-then-suffix order; (2) the
# real French street address was silently dropped (looksAddressLine had no
# French street-word marker); (3) the French "Code APE" business-activity
# code was wrongly absorbed into the address, purely because its
# 4-digit-plus-letter shape cleared the digit-run heuristic by coincidence;
# (4) Dutch "colofon" pages could be skipped entirely — the isLegalPage gate
# checked for the English "colophon" (with an 'h') instead of the actual
# Dutch spelling already used elsewhere in this codebase; (5) Dutch
# sole-trader ("Eenmanszaak") legal names were never extracted — no suffix,
# no label, just a standalone legal-form line; (6) the Dutch KvK/BTW-id
# lines were wrongly absorbed into the address ahead of (and instead of) the
# real street address; (7) post-2020 Dutch sole-trader BTW-id numbers were
# false-flagged checksum_invalid — since 2020-01-01 these are issued
# independently of the old BSN-derived elfproef algorithm (a privacy
# reform), with no published check-digit algorithm at all; now falls back
# to format_valid, matching the existing LU/GB precedent. Also tightened the
# Bug-3 titleCaseNameRun responsible-person fallback (imprint.go), which had
# mistaken a Dutch sole trader's bare, no-connector trading name for a
# person's name — now only accepts a run that is a proper subset of the
# full legal name, matching the hotelrose.at case that motivated it. Two new
# permanent regression tests
# (imprint_extract_eu_round1_test.go); full existing suite (including the
# hotelrose.at/atpkitz.at real-evidence tests from prior rounds) still
# green, no regressions.
# 2026-08-22 (1.5.3) — fourth real-evidence bug-fix pass. TRL stays at 6
# (bug fix within the existing band, not new capability/coverage). This pass
# stress-tested the shipped (1.5.0-1.5.2) extraction logic against realistic
# content from THIS PROJECT'S OWN ACTUAL TARGET POPULATION — real, live
# Austrian gambling-affiliate/comparison sites, the whole reason this
# imprint-extraction feature exists — rather than a hypothetical edge case.
# A realistic fixture built from atpkitz.at's real homepage content (a "Top
# 5" operator comparison table naming third-party licensed brands by name,
# a structural pattern this entire affiliate/comparison-site cohort
# exhibits, since a review page must name the operators it compares) found
# extractImprintFields() extracting "Winrolla GmbH" — a competitor brand
# named in marketing prose ("Winrolla GmbH ist ein weiterer Top-Anbieter mit
# MGA-Lizenz") — as the page's own legal_name. Root cause: the
# suffix-anchored plain-text scan (extractImprintText/extractEntityAround)
# trusted ANY capitalized-word-run-plus-legal-form-suffix match anywhere on
# the page as a real entity-identity candidate, with no requirement that it
# sit near any other imprint-shaped signal (address/register/VAT). Fixed
# with a new hasProximityCorroboration gate in bestImprintCandidate
# (imprint.go): a plain-text-sourced candidate (imprint_text/imprint_label)
# only wins if it carries a real address, register number, or VAT found
# near it — structured-data sources (json_ld/hcard) are unaffected, already
# high-confidence. Verifying this against a realistic MULTI-brand
# comparison-table variant (3 distinct GmbH/Ltd-suffixed brand mentions
# next to a numeric rating column) surfaced a second, related real bug: the
# address-line heuristic (looksAddressLine) treated ANY bare digit as
# address-shaped, so a rating cell ("9.6") or bonus blurb ("100% Bonus bis
# zu 500 Euro") was mistaken for a postal address, which would have let the
# false-positive brand slip through the new corroboration gate. Fixed at
# the root: looksAddressLine now requires a postal-code-shaped run of 4+
# consecutive digits (hasDigitRun) rather than "any digit at all" — this
# codebase's real target jurisdictions (DE 5-digit, AT/NL 4-digit postal
# codes) comfortably clear that bar; a rating/percentage/price fragment in
# ordinary prose essentially never does. Confirmed no regression against the
# real hotelrose.at fixture (still 100/100, full extraction unchanged) and
# against the two non-bug control cases from the same stress-testing pass (a
# JSON-LD WebPage.author Person byline, and a page merely listing brand
# names with no legal-form suffix at all) — both still correctly extract
# nothing. Six new regression tests (imprint_extract_real_evidence_test.go):
# the exact adversarial single-brand fixture, a multi-brand comparison-table
# variant (confirms the single per-candidate fix generalizes without a
# separate "multiple candidates" heuristic), plus direct unit tests of
# hasProximityCorroboration and hasDigitRun.
# 2026-08-22 (1.5.2) — third real-evidence bug-fix pass, continued live-site
# verification of the same hotelrose.at fixture the 1.5.1 pass used. TRL
# stays at 6 (bug fix within the existing band, not new capability/coverage;
# one concrete real-data fix, not a broad new validation pass). Ran the
# ACTUAL post-1.5.1 extractImprintFields() against hotelrose.at's real
# Impressum page again and found one more real, present field silently
# dropped: the page's visible text reads "UID-Nr.: ATU43951103" (a valid
# Austrian VAT, confirmed by the vendored checksum validator), captured by
# the imprint_label plain-text candidate — but the winning candidate is
# JSON-LD (@type "Hotel", ranked highest), which has no vatID field at all.
# mergeImprintCandidates only combines same-page candidates on exact
# case-insensitive name equality; the JSON-LD name ("Aktivhotel zur Rose -
# Franz Holzmann") and the plain-text label's name ("Aktivhotel Zur Rose")
# never matched, so the VAT-bearing candidate was discarded outright and the
# winning candidate's VAT stayed empty — and because scoreImprint only adds
# VAT to the completeness denominator when present, this page reported a
# deceptively perfect completeness_score: 100 despite genuinely failing to
# surface a real, present VAT number. Fixed with a new
# backfillWinnerIdentifiers step (imprint.go): after bestImprintCandidate()
# picks the winner, a missing Register/VAT is backfilled from any OTHER
# candidate in the SAME single-page candidate list that has it — not gated
# on name match, since extractImprintFields only ever runs on one
# already-fetched, already-verified page (no cross-entity conflation risk
# the way go_legal_entity's original multi-page mergeCandidates had to guard
# against). mergeImprintCandidates' existing exact-name merge behaviour for
# genuinely-duplicate same-named candidates is unchanged.
# 2026-08-22 (1.5.1) — real-evidence bug-fix pass on the imprint field
# extraction shipped earlier the same day (1.5.0). This is exactly the kind
# of live-domain validation the 1.5.0 note below flagged as NOT having
# happened yet — and it is now honest to say a SMALL amount of it has: this
# service's imprint-extraction output was manually compared against 3 real,
# live websites (4 pages: an Austrian hotel's Impressum, a gambling-
# affiliate homepage with no imprint, that same site's privacy page, and a
# second gambling-affiliate homepage with no imprint), fetched and read by
# hand, specifically hunting for false negatives/positives. That is a real,
# live-data-driven check, not a hypothetical one — but 3 sites is a small
# sample, not a statistical validation pass, so trl stays at 6 rather than
# moving toward 7 on this basis alone. Four concrete, real bugs found and fixed,
# each with a real-fixture regression test
# (imprint_extract_real_evidence_test.go):
#   1. JSON-LD Organization-subtype matching (isOrgType, imprint_jsonld.go)
#      only accepted an exact-match list (organization/corporation/
#      localbusiness/ngo/educationalorganization/governmentorganization/
#      performinggroup) — missed schema.org's real type hierarchy (Hotel ->
#      LodgingBusiness -> LocalBusiness -> Organization). Found via a real
#      Austrian hotel's Impressum page (@type: "Hotel"), whose JSON-LD block
#      (name/address/telephone/email) this service silently produced zero
#      fields from. Fixed by broadening the accepted-type set to ~60 common
#      schema.org LocalBusiness subtypes and second-level leaves
#      (Restaurant/Store/ProfessionalService/MedicalBusiness/
#      AutomotiveBusiness/FinancialService/Attorney/Dentist/
#      RealEstateAgent/... — not exhaustive, a curated common-case list).
#   2. The suffix-anchored legal-name text-scan (extractImprintText)
#      required a GmbH/AG/Ltd-style legal-form suffix to identify a
#      candidate name — systematically missing every sole-trader
#      (Einzelunternehmen) imprint, since sole traders legitimately have no
#      such suffix at all. Found on the same real Austrian hotel page, whose
#      visible text reads "Firmenname: Aktivhotel Zur Rose" with no legal
#      form anywhere. Fixed with a new fallback extraction path (source
#      "imprint_label", ranked below a real suffix match) recognising an
#      explicit label (Firmenname:/Company name:/Unternehmen:/Inhaber:)
#      anchored to the start of a line, so it does not fire on prose that
#      merely mentions the word.
#   3. The responsible-person checklist item (imprintFieldChecklist /
#      scoreImprint) required a separately-labelled line
#      (Geschäftsführer/verantwortlich für den Inhalt/managing director/...)
#      — which a sole trader's imprint never has, because the proprietor's
#      name IS the trading name (confirmed against the same real page:
#      "Aktivhotel zur Rose - Franz Holzmann", no separate label anywhere).
#      Austria's ECG §5 / Mediengesetz §§24-25 do not require a separately
#      labelled line when the proprietor's identity is already disclosed
#      this way. Fixed with an additional satisfaction path (not a
#      replacement for the label-based match): when no legal-form suffix was
#      found at all, the legal_name itself is checked for an embedded
#      two-plus-word Title-Case run that looks like a natural person's name.
#   4. Cloudflare's "Email Address Obfuscation" anti-scraping feature
#      (data-cfemail="<hex>" / /cdn-cgi/l/email-protection#<hex>", a public,
#      well-documented reversible single-byte-XOR encoding) defeated
#      hasImprintContact's plain-text email regex entirely — a real,
#      extremely common pattern, verified live on a real gambling-affiliate
#      homepage (brucebetcasino-at.com) using it to hide a real contact
#      address. Fixed by decoding the hex blob (same algorithm the
#      Cloudflare-injected browser JS itself uses) and counting a
#      successful decode toward the "contact" checklist item.
# Also checked and confirmed NOT bugs during this pass: the AT VAT label
# "UID-Nr.:" already matches regardless of preceding label text (the
# \bATU\d{8}\b format regex doesn't care about the label); a JSON-LD
# WebPage.author Person node (an SEO byline, seen on a real gambling-
# affiliate privacy page) was already correctly ignored by construction
# (Person was never an accepted type, and the @graph walk never recurses
# into an "author" field) — locked down with a regression test anyway.
# One judgment call: the register-court logic previously required an
# ALREADY-non-empty register NUMBER before it would append a named court
# (courtMention); the real hotel page names "Firmengericht: Landesgericht
# Innsbruck" but cites no FN number at all. Changed so a court-only mention
# now satisfies the "register" checklist item on its own — a defensible
# reading either way, taken here because the court IS a real, genuine
# register-authority disclosure even without an accompanying number.
# 2026-08-22 — new capability, not a re-audit (trl left at 6; this is
# additive functionality within the existing band, not new evidence toward
# TRL 7). Closes a real gap: DocImprint detection previously emitted only a
# boolean `imprint_present` (a bare `merged[DocImprint]` map-presence check),
# backed by verify.go's docTypeSignalRE[DocImprint] vocab sanity-check —
# enough to confirm a page plausibly IS an imprint page, but nothing about
# whether it actually discloses what EU e-Commerce Directive Art. 5 /
# Germany's TMG §5 (→DDG §5) / Austria's ECG §5 + Mediengesetz §§24-25
# require (legal entity name, address, register number, VAT ID, responsible
# person, contact). A new `imprint` object now runs structured field
# extraction on the already-fetched, already-verified imprint page body:
# legal name + legal-form suffix (via a trimmed, Latin-script port of
# go_legal_entity's entity-suffix table), address, country, register number
# (HRB/HRA/FN + court, via a vendored 27-EU-country+non-EU VAT/register
# identifier table — extended with an Austrian FN pattern the upstream table
# was missing), VAT + real per-country checksum validation (not just
# regex-shape matching), and a responsible-person name (new multi-language
# regex: Geschäftsführer/vertretungsberechtigt/verantwortlich für den Inhalt
# DE/AT, managing director/legal representative EN, représentant légal FR).
# Country-appropriate completeness scoring against one of three rulesets
# (eu_baseline / de_tmg / at_ecg_medieng), with the VAT's own country prefix
# taking precedence over a DE/AT-ambiguous legal-form-suffix guess (a bare
# "GmbH" alone cannot tell DE from AT) — found and fixed during this pass via
# a real Austrian-imprint fixture that initially resolved to the wrong
# country. 8 new test cases (imprint_extract_test.go): complete DE imprint
# (100% completeness, all fields), complete AT imprint (country-precedence
# regression coverage), a sparse imprint (low-but-nonzero completeness,
# correct fields_missing), a JSON-LD Organization page (proves the
# structured-data path is preferred over the plain-text line-scan, and that
# same-entity candidates from different sources on one page get merged
# rather than the non-selected source's fields being silently dropped), a
# false-positive guard (a blog post ABOUT the Impressum requirement must not
# hallucinate a company/register/VAT from the prose), a no-body
# graceful-degradation case, plus direct unit tests of the ported VAT
# checksum algorithms and the ruleset-selection function. Honest limitation:
# this is new capability, NOT yet validated against a live real-domain
# sample — that validation is planned for a later phase of this project,
# against real Austria/gambling-sector domains, and has not happened yet as
# of this note.
# 2026-07-31 genuine re-audit (fresh 60-domain sample, different hosts than
# the 2026-07-29 sample below; full source re-read end-to-end; safehttp
# fetch-cache-masking check done explicitly — see PR for the writeup): no
# trl/trl_ceiling contradiction found, no regression from the one commit
# since the last audit (Dockerfile HEALTHCHECK interval only). One real,
# evidence-backed correctness bug found and fixed: the fleetfetch fallback
# client used whenever the shared fetch cache is unreachable/slow silently
# dropped this service's own User-Agent (Go's bare default UA reached origin
# instead), inflating false blocked/unreachable verdicts specifically during
# cache degradation — live before/after proof in CHANGELOG.md 1.4.1. TRL
# stays at 6 (bug fix within the existing band, not a new capability); the
# JS-render ceiling reason is unchanged and still real.
# TRL evidence (2026-07-29 real-data pass, see PR that bumped 5->6):
#   - Live re-run of the SAME 1000 real hostnames (domains table sample)
#     before/after this change: 68/1000 (6.8%) previously-silent
#     verdict:"none" false negatives were bot-block/WAF-challenge homepages
#     (Cloudflare JS challenge, Apache 403 stub, generic WAF block), now
#     honestly reported as status:"blocked" instead of a false no-data claim.
#   - Two additional real bugs found and fixed with unit-test evidence: raw
#     non-UTF-8 body bytes (ISO-8859-1/Windows-1252 — confirmed present on
#     real domains in the same sample) fed straight into UTF-8 pattern
#     matching; and the German "Datenschutzerklärung" compound title failing
#     the bare `\bdatenschutz\b` regex.
#   - Persistence / cross-source corroboration: verified against the live
#     domainscope database (prod_2026_domainscope_scrapetheworld_org) that a
#     `domain_legal_docs` + `domain_legal_doc_items` evidence store ALREADY
#     exists and is actively populated from this tool's own output
#     (tool_name='go_tos_finder', 3.1M rows, fresh as of the day of this
#     audit) by the fleet's domainscope enrichment pipeline, keyed to
#     domain_id with a FK to the 11.9M-row domains table, with per-item
#     detection-method provenance (probed_path/footer_link/page_link). This
#     satisfies the "stored evidence store" the ceiling reason names as a
#     valid path to closing the persistence half of the gap — but it is
#     implemented OUTSIDE this repo (by the calling enrichment pipeline, not
#     by go_tos_finder's own code), and the store is latest-state-only (no
#     historical time series, no independent second-source corroboration).
#     TRL is bumped to 6, not to the ceiling of 7, on that basis: real,
#     measured detection-quality improvement plus real (if externally-owned)
#     persistence evidence, but no cross-source corroboration logic owned by
#     this service, and the JS-render limitation (naver.com-style SPA
#     footers) is unchanged and still real. See PR description for the full
#     writeup this comment summarises.
port: 8316

api:
  endpoint: /?api_key={token}
  method: GET
  params:
    - name: target
      type: string
      required: true
      description: URL of the public site whose legal documents (ToS, privacy, cookies, DMCA, AUP, GDPR/DPA, imprint, etc.) should be located.

health:
  endpoint: /health
  expected_status: 200

# NOTE (2026-08-22): rewritten from the deprecated /t/default_token/ path
# form (fleet-wide 410/404 since 2026-05-14) to the canonical ?api_key=
# query form. `default_token` itself was separately sunset fleet-wide as a
# security risk and no longer authenticates against the hosted gateway —
# this smoke test will 401 until fleet tooling injects a real provisioned
# key in its place — left as-is rather than guessing at a replacement
# mechanism for shared fleet-runner smoke-test automation.
test:
  url: /?api_key=default_token&target=https://github.com
  expected_status: 200

deploy:
  path: /opt/services/go_tos_finder

requires:
  - docker
  - pentest_network
